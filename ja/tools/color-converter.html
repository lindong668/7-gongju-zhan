<script>

function ccSet(r,g,b){
  document.getElementById('ccR').value=r;document.getElementById('ccG').value=g;document.getElementById('ccB').value=b;
  document.getElementById('ccIn').value='#'+[r,g,b].map(function(x){return ('0'+Math.round(x).toString(16)).slice(-2);}).join('').toUpperCase();
  ccShow(r,g,b);
}
function ccFromHex(){
  var h=document.getElementById('ccIn').value.trim().replace('#','');
  if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h))return;
  ccShow(parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16));
}
function ccFromRgb(){
  var r=Math.min(255,Math.max(0,parseInt(document.getElementById('ccR').value,10)||0));
  var g=Math.min(255,Math.max(0,parseInt(document.getElementById('ccG').value,10)||0));
  var b=Math.min(255,Math.max(0,parseInt(document.getElementById('ccB').value,10)||0));
  ccSet(r,g,b);
}
function ccShow(r,g,b){
  document.getElementById('ccSw').style.background='rgb('+r+','+g+','+b+')';
  document.getElementById('ccHex').textContent='#'+[r,g,b].map(function(x){return ('0'+x.toString(16)).slice(-2);}).join('').toUpperCase();
  document.getElementById('ccRgb').textContent='rgb('+r+', '+g+', '+b+')';
  var rr=r/255,gg=g/255,bb=b/255;
  var mx=Math.max(rr,gg,bb),mn=Math.min(rr,gg,bb),d=mx-mn;
  var h=0,s=0,l=(mx+mn)/2;
  if(d){
    s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===rr)h=((gg-bb)/d+(gg<bb?6:0));
    else if(mx===gg)h=(bb-rr)/d+2;
    else h=(rr-gg)/d+4;
    h*=60;
  }
  document.getElementById('ccHsl').textContent='hsl('+Math.round(h)+', '+Math.round(s*100)+'%, '+Math.round(l*100)+'%)';
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('ccRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('ccRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('ccRun'&&typeof window['ccRun']==='function'){window['ccRun']();}
  }catch(e){console.warn(e);}
});
</script>
