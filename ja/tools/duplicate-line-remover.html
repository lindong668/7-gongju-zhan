banana
apple

  Banana  
date</textarea></div>

<div class="fld"><label><input type="checkbox" id="dlCase"> Case-sensitive compare</label></div>

<button class="btn" onclick="dlRun()">実行</button>

<script>

function dlRun(){
  var raw=document.getElementById('dlIn').value.split('\n');
  var trim=document.getElementById('dlTrim').checked;
  var drop=document.getElementById('dlBlank').checked;
  var sort=document.getElementById('dlSort').checked;
  var cs=document.getElementById('dlCase').checked;
  var seen={},out=[];
  for(var i=0;i<raw.length;i++){
    var l=trim?raw[i].trim():raw[i];
    if(drop&&!l)continue;
    var k=cs?l:l.toLowerCase();
    if(seen[k])continue;
    seen[k]=1;out.push(l);
  }
  if(sort)out.sort();
  document.getElementById('dlIn2').textContent=raw.length;
  document.getElementById('dlOut2').textContent=out.length;
  document.getElementById('dlRm').textContent=raw.length-out.length;
  document.getElementById('dlRes').value=out.join('\n');
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('dlRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('dlRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('dlRun'&&typeof window['dlRun']==='function'){window['dlRun']();}
  }catch(e){console.warn(e);}
});
</script>
