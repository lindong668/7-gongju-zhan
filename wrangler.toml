# Utilixo — Cloudflare Workers + Assets
# 域名 hoo.us.ci
name = "utilixo-tools"
compatibility_date = "2026-09-01"
main = "src/index.js"

routes = [
  { pattern = "hoo.us.ci/*", zone_name = "us.ci" }
]

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
