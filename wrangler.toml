# Utilixo — Cloudflare Workers + Assets
# 域名 hho.us.ci
name = "utilixo-tools"
compatibility_date = "2026-09-01"
main = "src/index.js"

# 关闭遥测（官方写法，无引号）
send_metrics = false

routes = [
  { pattern = "hho.us.ci/*", zone_name = "hho.us.ci" }
]

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
