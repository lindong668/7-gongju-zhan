# ============================================================
# Utilixo —— Cloudflare Workers + Assets
# 域名：hoo.us.ci
#
# ★ 请用本文件内容【整体替换】仓库里的 wrangler.toml
#   不要只改某一行，直接全选覆盖，避免残留旧值
# ============================================================

# 与 Workers Builds 的 CI 名一致，消除 "Failed to match Worker name" 警告
name = "7-gongju-zhan"

compatibility_date = "2026-09-01"
main = "src/index.js"

# ★★ 关键：这一行【必须删掉/注释掉】，不要写死
#    Workers Builds 会自动使用当前连接的账号，永远不会冲突。
#    写死就会触发 "account_id must match" 报错（已经连错两次）。
# account_id = "aaf1535472bd88c1440f64028060678e"

# zone_name 填「CF 面板网站列表里看到的那个名字」= hoo.us.ci，不是母域 us.ci
routes = [
  { pattern = "hoo.us.ci/*",     zone_name = "hoo.us.ci" },
  { pattern = "www.hoo.us.ci/*", zone_name = "hoo.us.ci" }
]

[assets]
directory = "./public"
binding = "ASSETS"

# 必须开启，否则 Worker 代码不执行（www → apex 301 会变成死代码）
run_worker_first = true

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

# 避免 Workers Builds 预览构建报红叉
[previews]
