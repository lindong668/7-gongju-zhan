<div class="panel"><div class="row">
<div class="fld"><label for="loN">量</label><input id="loN" type="number" value="4" min="1" max="100" oninput="loRun()"></div>
<div class="fld"><label for="loU">単位</label><select id="loU" onchange="loRun()"><option value="p">段落</option><option value="s">文</option><option value="w">単語</option></select></div>
<div class="fld"><label for="loT">文体</label><select id="loT" onchange="loRun()"><option value="l">古典ラテン語</option><option value="e">平易な英語</option></select></div>
</div>
<div class="fld"><label><input type="checkbox" id="loStart" onchange="loRun()"> Start with "Lorem ipsum dolor sit amet"</label></div>
<button class="btn" onclick="loRun()">生成</button>
<div class="fld" style="margin-top:12px"><label>出力</label><textarea id="loOut" readonly style="min-height:180px"></textarea></div>
<div style="margin-top:9px"><button class="btn-o" onclick="utilixoCopy(document.getElementById('loOut').value,this)">コピー</button></div></div>

<script>

var LO_L='lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum'.split(' ');
var LO_E='the quick overview shows how layout holds together when real copy is still being written designers use filler text to judge spacing rhythm and hierarchy before final words arrive this sample keeps a natural sentence length so line breaks look realistic'.split(' ');
function loPick(a){return a[Math.floor(Math.random()*a.length)];}
function loRun(){
  var n=Math.min(100,Math.max(1,parseInt(document.getElementById('loN').value,10)||1));
  var u=document.getElementById('loU').value;
  var t=document.getElementById('loT').value;
  var w=t==='l'?LO_L:LO_E;
  var out='';
  function sentence(cnt){
    var s=[];
    for(var i=0;i<cnt;i++)s.push(loPick(w));
    var str=s.join(' ');
    return str.charAt(0).toUpperCase()+str.slice(1)+'.';
  }
  if(u==='w'){
    var ws=[];
    for(var i=0;i<n;i++)ws.push(loPick(w));
    out=ws.join(' ');
    out=out.charAt(0).toUpperCase()+out.slice(1)+'.';
    if(document.getElementById('loStart').checked)out='Lorem ipsum dolor sit amet, '+out.charAt(0).toLowerCase()+out.slice(1);
  }else if(u==='s'){
    var ss=[];
    for(var i2=0;i2<n;i2++)ss.push(sentence(8+Math.floor(Math.random()*10)));
    out=ss.join(' ');
    if(document.getElementById('loStart').checked)out='Lorem ipsum dolor sit amet, consectetur adipiscing elit. '+out;
  }else{
    var ps=[];
    for(var i3=0;i3<n;i3++){
      var cnt=3+Math.floor(Math.random()*3);
      var ss2=[];
      for(var j=0;j<cnt;j++)ss2.push(sentence(9+Math.floor(Math.random()*12)));
      ps.push(ss2.join(' '));
    }
    out=ps.join('\n\n');
    if(document.getElementById('loStart').checked){
      out='Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.\n\n'+out;
    }
  }
  document.getElementById('loOut').value=out;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('loRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('loRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('loRun'&&typeof window['loRun']==='function'){window['loRun']();}
  }catch(e){console.warn(e);}
});
</script>
