<h1 style="margin:0">チップ・割り勘計算機</h1></div>
<p>チップを計算し、任意の人数で割り勘。</p></div>
<div class="panel"><div class="row">
<div class="fld"><label for="tBill">会計金額</label><input id="tBill" type="number" value="85.50" oninput="tRun()"></div>
<div class="fld"><label for="tPct">チップ率 %</label><input id="tPct" type="number" value="18" oninput="tRun()"></div>
<div class="fld"><label for="tPpl">人数</label><input id="tPpl" type="number" value="4" min="1" oninput="tRun()"></div>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
<button class="btn-o" onclick="tSet(15)">15%</button><button class="btn-o" onclick="tSet(18)">18%</button>
<button class="btn-o" onclick="tSet(20)">20%</button><button class="btn-o" onclick="tSet(0)">チップなし</button></div>
<div class="res-grid">
<div class="res-cell"><div class="k">Tip</div><div class="v" id="tTip">—</div></div>
<div class="res-cell"><div class="k">Total</div><div class="v" id="tTot">—</div></div>
<div class="res-cell"><div class="k">Per person</div><div class="v" id="tPer">—</div></div>
</div></div>

<script>

function fMoney(x){return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function tSet(v){document.getElementById('tPct').value=v;tRun();}
function tRun(){
  var b=parseFloat(document.getElementById('tBill').value)||0;
  var p=parseFloat(document.getElementById('tPct').value)||0;
  var n=parseInt(document.getElementById('tPpl').value,10)||1;
  if(n<1)n=1;
  var tip=b*p/100, tot=b+tip, per=tot/n;
  document.getElementById('tTip').textContent=fMoney(tip);
  document.getElementById('tTot').textContent=fMoney(tot);
  document.getElementById('tPer').textContent=fMoney(per);
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('tRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('tRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('tRun'&&typeof window['tRun']==='function'){window['tRun']();}
  }catch(e){console.warn(e);}
});
</script>
