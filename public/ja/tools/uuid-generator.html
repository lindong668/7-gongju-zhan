<script>

function uuRun(){
  var n=Math.min(500,Math.max(1,parseInt(document.getElementById('uuN').value,10)||1));
  var up=document.getElementById('uuU').value==='upper';
  var nh=document.getElementById('uuH').checked;
  var out=[];
  for(var i=0;i<n;i++){
    var s=(crypto.randomUUID?crypto.randomUUID():uuFallback());
    if(nh)s=s.replace(/-/g,'');
    if(up)s=s.toUpperCase();
    out.push(s);
  }
  document.getElementById('uuOut').value=out.join('\n');
}
function uuFallback(){
  var b=new Uint8Array(16);crypto.getRandomValues(b);
  b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;
  var h=[].map.call(b,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('uuRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('uuRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('uuRun'&&typeof window['uuRun']==='function'){window['uuRun']();}
  }catch(e){console.warn(e);}
});
</script>
