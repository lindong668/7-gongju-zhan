<script>

function sRun(){
  var v=document.getElementById('sIn').value;
  var sep=document.getElementById('sSep').value;
  var c=document.getElementById('sCase').value;
  var s=v.trim();
  if(c==='lower')s=s.toLowerCase();
  s=s.replace(/[''`"]/g,'')
     .replace(/[^a-zA-Z0-9\s-_]/g,'')
     .replace(/\s+/g,sep)
     .replace(new RegExp('['+sep+']{2,}','g'),sep)
     .replace(new RegExp('^'+sep+'+|'+sep+'+$','g'),'');
  document.getElementById('sOut').textContent=s;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('sRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('sRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('sRun'&&typeof window['sRun']==='function'){window['sRun']();}
  }catch(e){console.warn(e);}
});
</script>
