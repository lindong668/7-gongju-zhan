<script>

function eEnc(){
  document.getElementById('eOut').value=document.getElementById('eIn').value
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function eDec(){
  var ta=document.createElement('textarea');
  ta.innerHTML=document.getElementById('eIn').value;
  document.getElementById('eOut').value=ta.value;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('eEnc'==='grInit'){grAdd();grAdd();grAdd();}
    else if('eEnc'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('eEnc'&&typeof window['eEnc']==='function'){window['eEnc']();}
  }catch(e){console.warn(e);}
});
</script>
