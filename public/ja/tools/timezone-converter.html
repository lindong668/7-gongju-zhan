<script>

var TZS=[
 ['UTC','UTC'],['America/New_York','New York'],['America/Chicago','Chicago'],
 ['America/Denver','Denver'],['America/Los_Angeles','Los Angeles'],
 ['Europe/London','London'],['Europe/Paris','Paris'],['Europe/Berlin','Berlin'],
 ['Europe/Madrid','Madrid'],['Asia/Shanghai','Shanghai'],['Asia/Tokyo','Tokyo'],
 ['Asia/Singapore','Singapore'],['Asia/Dubai','Dubai'],['Asia/Kolkata','India'],
 ['Australia/Sydney','Sydney'],['America/Sao_Paulo','São Paulo']
];
(function(){
  var s=document.getElementById('tzFrom');
  s.innerHTML=TZS.map(function(z){return '<option value="'+z[0]+'">'+z[1]+' ('+z[0]+')</option>';}).join('');
  var d=new Date();
  document.getElementById('tzD').value=d.toISOString().slice(0,10);
  var local=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  try{
    var lt=local.toLocaleString('en-US',{timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,hour12:false,hour:'2-digit',minute:'2-digit'});
    document.getElementById('tzV').value=lt.replace(/\s?(AM|PM)$/,'');
  }catch(e){document.getElementById('tzV').value=d.toTimeString().slice(0,5);}
  s.value='UTC';
  tzRun();tzNow();
})();
function tzFmt(date,tz){
  try{return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short',weekday:'short'}).format(date);}
  catch(e){return '—';}
}
function tzOff(tz,date){
  try{
    var s=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(date);
    var p=s.find(function(x){return x.type==='timeZoneName';});
    return p?p.value:'';
  }catch(e){return '';}
}
function tzRun(){
  var t=document.getElementById('tzV').value,d=document.getElementById('tzD').value;
  var from=document.getElementById('tzFrom').value;
  if(!t||!d)return;
  var parts=t.split(':');
  /* 以"选中时区"的那个墙钟时间构造 UTC 时刻：先按 UTC 解析，再减去该时区的偏移 */
  var guess=new Date(Date.UTC(parseInt(d.slice(0,4),10),parseInt(d.slice(5,7),10)-1,parseInt(d.slice(8,10),10),parseInt(parts[0],10),parseInt(parts[1],10)));
  var offA=tzOffFrom(guess,from);
  var base=new Date(guess.getTime()-offA*60000);
  var h='';
  TZS.forEach(function(z){
    h+='<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;gap:10px">'
     +'<b>'+z[1]+'</b><span>'+tzFmt(base,z[0])+' <span style="color:var(--muted);font-size:12px">'+tzOff(z[0],base)+'</span></span></div>';
  });
  document.getElementById('tzList').innerHTML=h;
}
function tzOffFrom(date,tz){
  var s=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(date);
  var g={};s.forEach(function(p){g[p.type]=p.value;});
  var asUTC=Date.UTC(+g.year,+g.month-1,+g.day,+g.hour,+g.minute,+g.second);
  return (asUTC-date.getTime())/60000;
}
function tzNow(){
  var now=new Date(),h='';
  TZS.forEach(function(z){
    h+='<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px">'
     +'<span>'+z[1]+'</span><b>'+tzFmt(now,z[0])+'</b></div>';
  });
  document.getElementById('tzNow').innerHTML=h;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if(''==='grInit'){grAdd();grAdd();grAdd();}
    else if(''==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if(''&&typeof window['']==='function'){window['']();}
  }catch(e){console.warn(e);}
});
</script>
