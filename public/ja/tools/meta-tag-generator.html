<script>

function mtEsc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mtRun(){
  var t=document.getElementById('mtT').value,d=document.getElementById('mtD').value;
  var u=document.getElementById('mtU').value,i=document.getElementById('mtI').value;
  var s=document.getElementById('mtS').value,tw=document.getElementById('mtTw').value;
  var th=document.getElementById('mtTh').value;
  var l=[];
  l.push('<title>メタタグ生成ツール — すべてのツール | Utilixo</title>');
  l.push('<meta name="description" content="SEO、Open Graph、Twitterカードのタグを作成。">');
  if(u)l.push('<link rel="canonical" href="'+mtEsc(u)+'">');
  l.push('<meta name="theme-color" content="'+th+'">');
  l.push('');
  l.push('<!-- Open Graph -->');
  l.push('<meta property="og:type" content="website">');
  l.push('<meta property="og:site_name" content="'+mtEsc(s)+'">');
  l.push('<meta property="og:title" content="メタタグ生成ツール — すべてのツール">');
  l.push('<meta property="og:description" content="SEO、Open Graph、Twitterカードのタグを作成。">');
  if(u)l.push('<meta property="og:url" content="'+mtEsc(u)+'">');
  if(i){l.push('<meta property="og:image" content="'+mtEsc(i)+'">');l.push('<meta property="og:image:width" content="1200">');l.push('<meta property="og:image:height" content="630">');}
  l.push('');
  l.push('<!-- Twitter -->');
  l.push('<meta name="twitter:card" content="summary_large_image">');
  l.push('<meta name="twitter:title" content="メタタグ生成ツール — すべてのツール">');
  l.push('<meta name="twitter:description" content="SEO、Open Graph、Twitterカードのタグを作成。">');
  if(i)l.push('<meta name="twitter:image" content="'+mtEsc(i)+'">');
  if(tw)l.push('<meta name="twitter:site" content="'+mtEsc(tw)+'">');
  var out=l.join('\n');
  document.getElementById('mtOut').value=out;
  var warn=[];
  if(t.length>60)warn.push('Title is '+t.length+' chars — search results usually cut around 60.');
  if(d.length>160)warn.push('Description is '+d.length+' chars — aim for 155 or fewer.');
  document.getElementById('mtMsg').innerHTML=warn.length?'<div class="err-t">'+warn.join(' ')+'</div>':'<div class="ok-t">Lengths look good.</div>';
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('mtRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('mtRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('mtRun'&&typeof window['mtRun']==='function'){window['mtRun']();}
  }catch(e){console.warn(e);}
});
</script>
