<div class="fld"><label for="dc1">割引 1（%）</label><input id="dc1" type="number" value="20" oninput="dcRun()"></div>
<div class="fld"><label for="dc2">割引 2（%）— 任意</label><input id="dc2" type="number" value="10" oninput="dcRun()"></div>
<div class="fld"><label for="dcTax">消費税（%）</label><input id="dcTax" type="number" value="8.25" step="0.01" oninput="dcRun()"></div>

<script>

function dcRun(){
  var p=parseFloat(document.getElementById('dcP').value)||0;
  var d1=parseFloat(document.getElementById('dc1').value)||0;
  var d2=parseFloat(document.getElementById('dc2').value)||0;
  var tx=parseFloat(document.getElementById('dcTax').value)||0;
  var sale=p*(1-d1/100)*(1-d2/100);
  var save=p-sale;
  var tot=sale*(1+tx/100);
  document.getElementById('dcS').textContent=fMoney(save);
  document.getElementById('dcSp').textContent=fMoney(sale);
  document.getElementById('dcTot').textContent=fMoney(tot);
  if(d1&&d2){
    var eff=(1-(1-d1/100)*(1-d2/100))*100;
    document.getElementById('dcMsg').innerHTML='<p class="note">'+d1+'% then '+d2+'% is <b>'+eff.toFixed(1)+'%</b> off in total — not '+(d1+d2)+'%. Successive discounts multiply, they do not add.</p>';
  }else{document.getElementById('dcMsg').innerHTML='';}
}
function fMoney(x){return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('dcRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('dcRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('dcRun'&&typeof window['dcRun']==='function'){window['dcRun']();}
  }catch(e){console.warn(e);}
});
</script>
