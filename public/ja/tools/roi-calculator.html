<p>投資利益率と損益分岐点に必要な数量。</p></div>
<div class="panel"><div class="fld"><label>モード</label><select id="roiM" onchange="roiM()"><option value="roi">投資利益率</option><option value="be">損益分岐点の数量</option></select></div>
<div id="roiA">
<div class="row">
<div class="fld"><label for="rInv">投資額</label><input id="rInv" type="number" value="50000" oninput="roiRun()"></div>
<div class="fld"><label for="rRet">回収額</label><input id="rRet" type="number" value="68000" oninput="roiRun()"></div>
</div></div>
<div id="roiB" style="display:none">
<div class="row">
<div class="fld"><label for="rFix">固定費</label><input id="rFix" type="number" value="12000" oninput="roiRun()"></div>
<div class="fld"><label for="rPrice">単価</label><input id="rPrice" type="number" value="40" oninput="roiRun()"></div>
<div class="fld"><label for="rVar">1個あたり変動費</label><input id="rVar" type="number" value="15" oninput="roiRun()"></div>
</div></div>
<div class="out" style="margin-top:12px"><div class="out-val" id="roiOut">—</div><div class="out-sub" id="roiSub"></div></div></div>

<script>

function roiM(){
  var m=document.getElementById('roiM').value;
  document.getElementById('roiA').style.display=m==='roi'?'':'none';
  document.getElementById('roiB').style.display=m==='be'?'':'none';
  roiRun();
}
function roiRun(){
  var m=document.getElementById('roiM').value;
  var o=document.getElementById('roiOut'),s=document.getElementById('roiSub');
  if(m==='roi'){
    var inv=parseFloat(document.getElementById('rInv').value)||0;
    var ret=parseFloat(document.getElementById('rRet').value)||0;
    if(inv===0){o.textContent='—';s.textContent='Investment cannot be zero.';return;}
    var roi=(ret-inv)/inv*100;
    o.textContent=(roi>=0?'+':'')+roi.toFixed(2)+'%';
    s.textContent=(ret>=inv?'Gain ':'Loss ')+fMoney(Math.abs(ret-inv));
  }else{
    var fix=parseFloat(document.getElementById('rFix').value)||0;
    var pr=parseFloat(document.getElementById('rPrice').value)||0;
    var vc=parseFloat(document.getElementById('rVar').value)||0;
    var cm=pr-vc;
    if(cm<=0){o.textContent='—';s.textContent='Unit price must exceed variable cost, otherwise every sale loses money.';return;}
    var u=fix/cm;
    o.textContent=Math.ceil(u)+' units';
    s.textContent='Contribution margin '+fMoney(cm)+' per unit · break-even revenue '+fMoney(Math.ceil(u)*pr);
  }
}
function fMoney(x){return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('roiM'==='grInit'){grAdd();grAdd();grAdd();}
    else if('roiM'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('roiM'&&typeof window['roiM']==='function'){window['roiM']();}
  }catch(e){console.warn(e);}
});
</script>
