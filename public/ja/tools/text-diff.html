<script>

function dRun(){
  var a=document.getElementById('dA').value.split('\n');
  var b=document.getElementById('dB').value.split('\n');
  var n=Math.max(a.length,b.length),add=0,del=0,same=0;
  var h='<div class="panel"><div class="panel-t">Line-by-line</div><div style="font-family:var(--mono);font-size:12.5px;line-height:1.7;overflow:auto">';
  for(var i=0;i<n;i++){
    var x=a[i],y=b[i];
    if(x===undefined){h+='<div style="background:rgba(16,185,129,.13);padding:2px 7px;border-radius:4px">+ '+esc2(y)+'</div>';add++;}
    else if(y===undefined){h+='<div style="background:rgba(239,68,68,.12);padding:2px 7px;border-radius:4px">- '+esc2(x)+'</div>';del++;}
    else if(x===y){h+='<div style="padding:2px 7px;color:var(--muted)">&nbsp; '+esc2(x)+'</div>';same++;}
    else{h+='<div style="background:rgba(239,68,68,.12);padding:2px 7px;border-radius:4px">- '+esc2(x)+'</div><div style="background:rgba(16,185,129,.13);padding:2px 7px;border-radius:4px">+ '+esc2(y)+'</div>';add++;del++;}
  }
  h+='</div><div class="res-grid" style="margin-top:14px">'
   +'<div class="res-cell"><div class="k">Added</div><div class="v" style="color:var(--ok)">'+add+'</div></div>'
   +'<div class="res-cell"><div class="k">Removed</div><div class="v" style="color:var(--err)">'+del+'</div></div>'
   +'<div class="res-cell"><div class="k">Unchanged</div><div class="v">'+same+'</div></div></div></div>';
  document.getElementById('dOut').innerHTML=h;
}
function esc2(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('dRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('dRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('dRun'&&typeof window['dRun']==='function'){window['dRun']();}
  }catch(e){console.warn(e);}
});
</script>
