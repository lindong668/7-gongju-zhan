<h1 style="margin:0">贷款与月供计算器</h1></div>
<p>计算月供、总利息与完整还款计划。</p></div>
<div class="panel"><div class="row">
<div class="fld"><label for="lAmt">贷款金额</label><input id="lAmt" type="number" value="25000" oninput="lRun()"></div>
<div class="fld"><label for="lRate">年利率（APR %）</label><input id="lRate" type="number" value="6.9" step="0.01" oninput="lRun()"></div>

</div>

<script>

/* 标准等额本息：M = P·i·(1+i)^n / ((1+i)^n − 1)  i=月利率 */
function fPmt(P,annualPct,years){
  var n=Math.round(years*12), i=annualPct/100/12;
  if(n<=0)return 0;
  if(i===0)return P/n;
  var f=Math.pow(1+i,n);
  return P*i*f/(f-1);
}
function fMoney(x,cur){
  cur=cur||'$';
  return (x<0?'-':'')+cur+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fAmort(P,annualPct,years){
  var n=Math.round(years*12), i=annualPct/100/12;
  var m=fPmt(P,annualPct,years), bal=P, rows=[], ti=0;
  for(var k=1;k<=n&&k<=600;k++){
    var int_=bal*i, prin=m-int_;
    if(prin>bal)prin=bal;
    ti+=int_; bal-=prin;
    rows.push({k:k,pmt:m,int_:int_,prin:prin,bal:Math.max(0,bal)});
    if(bal<=0.005)break;
  }
  return {rows:rows,totalInterest:ti,monthly:m};
}
function lRun(){
  var P=parseFloat(document.getElementById('lAmt').value);
  var r=parseFloat(document.getElementById('lRate').value);
  var y=parseFloat(document.getElementById('lYrs').value);
  if(!(P>0)||isNaN(r)||!(y>0)){document.getElementById('lPmt').textContent='—';return;}
  var a=fAmort(P,r,y);
  document.getElementById('lPmt').textContent=fMoney(a.monthly);
  document.getElementById('lInt').textContent=fMoney(a.totalInterest);
  document.getElementById('lTot').textContent=fMoney(P+a.totalInterest);
  var rows=a.rows;
  var h='<div class="panel"><div class="panel-t">Amortization (first 24 months)</div><div style="max-height:360px;overflow:auto"><table class="tbl"><thead><tr><th>#</th><th>Payment</th><th>Interest</th><th>Principal</th><th>Balance</th></tr></thead><tbody>';
  for(var i=0;i<Math.min(24,rows.length);i++){
    var x=rows[i];
    h+='<tr><td>'+x.k+'</td><td>'+fMoney(x.pmt)+'</td><td>'+fMoney(x.int_)+'</td><td>'+fMoney(x.prin)+'</td><td>'+fMoney(x.bal)+'</td></tr>';
  }
  h+='</tbody></table></div>';
  if(rows.length>24)h+='<p class="note">Showing 24 of '+rows.length+' months.</p>';
  h+='</div>';
  document.getElementById('lTbl').innerHTML=h;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('lRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('lRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('lRun'&&typeof window['lRun']==='function'){window['lRun']();}
  }catch(e){console.warn(e);}
});
</script>
