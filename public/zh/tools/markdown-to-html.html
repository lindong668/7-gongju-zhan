<script>

function mEsc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function mInline(s){
  s=mEsc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  return s;
}
function mRun(){
  var lines=document.getElementById('mIn').value.split('\n');
  var out=[],inUl=false,inOl=false,inCode=false,inP=false;
  function closeAll(){
    if(inUl){out.push('</ul>');inUl=false;}
    if(inOl){out.push('</ol>');inOl=false;}
    if(inP){out.push('</p>');inP=false;}
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(/^```/.test(l.trim())){
      closeAll();
      if(inCode){out.push('</code></pre>');inCode=false;}else{out.push('<pre><code>');inCode=true;}
      continue;
    }
    if(inCode){out.push(mEsc(l));continue;}
    var h=l.match(/^(#{1,6})\s+(.*)$/);
    if(h){closeAll();var lv=h[1].length;out.push('<h'+lv+'>'+mInline(h[2])+'</h'+lv+'>');continue;}
    if(/^\s*[-*+]\s+/.test(l)){
      if(inP){out.push('</p>');inP=false;}
      if(!inUl){closeAll();out.push('<ul>');inUl=true;}
      out.push('<li>'+mInline(l.replace(/^\s*[-*+]\s+/,''))+'</li>');continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      if(inP){out.push('</p>');inP=false;}
      if(!inOl){closeAll();out.push('<ol>');inOl=true;}
      out.push('<li>'+mInline(l.replace(/^\s*\d+\.\s+/,''))+'</li>');continue;
    }
    if(!l.trim()){closeAll();continue;}
    if(!inP){closeAll();out.push('<p>');inP=true;}
    out.push(mInline(l));
  }
  closeAll();
  if(inCode)out.push('</code></pre>');
  var h=out.join('\n');
  document.getElementById('mOut').value=h;
  document.getElementById('mPrev').innerHTML=h;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('mRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('mRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('mRun'&&typeof window['mRun']==='function'){window['mRun']();}
  }catch(e){console.warn(e);}
});
</script>
