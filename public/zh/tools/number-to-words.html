<script>

var nOnes=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
var nTens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function nUnder1000(n){
  var s='';
  if(n>=100){s+=nOnes[Math.floor(n/100)]+' hundred';n%=100;if(n)s+=' ';}
  if(n>=20){s+=nTens[Math.floor(n/10)];n%=10;if(n)s+='-'+nOnes[n];}
  else if(n>0){s+=nOnes[n];}
  return s;
}
function nWords(num){
  if(num===0)return 'zero';
  var neg=num<0;num=Math.abs(num);
  var parts=num.toString().split('.');
  var int=parseInt(parts[0],10);
  var scales=[['',1],['thousand',1000],['million',1000000],['billion',1000000000],['trillion',1000000000000]];
  var s='';
  if(int===0)s='zero';
  else{
    for(var i=scales.length-1;i>=0;i--){
      var v=Math.floor(int/scales[i][1]);
      if(v>0){
        if(s)s+=' ';
        s+=nUnder1000(v)+' '+scales[i][0];
        int-=v*scales[i][1];
      }
    }
    s=s.trim();
  }
  if(parts[1]){
    var dec=parts[1].slice(0,4);
    s+=' point '+dec.split('').map(function(d){return nOnes[parseInt(d,10)]||'zero';}).join(' ');
  }
  return (neg?'negative ':'')+s;
}
function nRun(){
  var v=parseFloat(document.getElementById('nIn').value);
  var o=document.getElementById('nOut');
  if(isNaN(v)){o.textContent='—';return;}
  if(Math.abs(v)>=1e15){o.textContent='Number too large';return;}
  o.textContent=nWords(v);
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('nRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('nRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('nRun'&&typeof window['nRun']==='function'){window['nRun']();}
  }catch(e){console.warn(e);}
});
</script>
