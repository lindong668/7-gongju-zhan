<script>

function ciRun(){
  var P=parseFloat(document.getElementById('ciP').value)||0;
  var r=parseFloat(document.getElementById('ciR').value)/100||0;
  var y=parseFloat(document.getElementById('ciY').value)||0;
  var n=parseInt(document.getElementById('ciN').value,10)||12;
  var c=parseFloat(document.getElementById('ciC').value)||0;
  if(y<=0){document.getElementById('ciF').textContent='—';return;}
  var bal=P, contributed=P, rows=[];
  for(var yr=1;yr<=Math.min(y,60);yr++){
    for(var k=0;k<n;k++){
      bal=bal*(1+r/n);
      bal+=c*(12/n);
      contributed+=c*(12/n);
    }
    if(yr%Math.ceil(y/10)===0||yr===Math.round(y))rows.push({y:yr,bal:bal});
  }
  var interest=bal-contributed;
  document.getElementById('ciF').textContent=fMoney(bal);
  document.getElementById('ciC2').textContent=fMoney(contributed);
  document.getElementById('ciI').textContent=fMoney(interest);
  var h='<div class="panel"><div class="panel-t">Year by year</div><table class="tbl"><thead><tr><th>Year</th><th>Balance</th></tr></thead><tbody>';
  rows.forEach(function(x){h+='<tr><td>'+x.y+'</td><td>'+fMoney(x.bal)+'</td></tr>';});
  h+='</tbody></table><p class="note">Monthly contributions are compounded at the same frequency as the balance.</p></div>';
  document.getElementById('ciTbl').innerHTML=h;
}
function fMoney(x){return '$'+x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('ciRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('ciRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('ciRun'&&typeof window['ciRun']==='function'){window['ciRun']();}
  }catch(e){console.warn(e);}
});
</script>
