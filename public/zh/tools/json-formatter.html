<div class="panel"><div class="fld"><label for="jIn">粘贴 JSON</label><textarea id="jIn" placeholder='{"name":"Utilixo","tools":56,"ok":true}'></textarea></div>
<div class="row"><div class="fld"><label for="jIndent">缩进</label><select id="jIndent"><option value="2">2 个空格</option><option value="4">4 个空格</option><option value="tab">制表符</option></select></div></div>
<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:6px">
<button class="btn" onclick="jFmt()">格式化</button><button class="btn-o" onclick="jMin()">压缩</button>
<button class="btn-o" onclick="jClr()">清空</button></div>

<div class="fld" style="margin-top:12px"><label>输出</label><textarea id="jOut" readonly></textarea></div>
<div style="margin-top:9px"><button class="btn-o" onclick="utilixoCopy(document.getElementById('jOut').value,this)">复制输出</button></div></div>

<script>

function jSet(t,c){var m=document.getElementById('jMsg');m.innerHTML='<div class="'+(c?'ok-t':'err-t')+'">'+t+'</div>';}
function jFmt(){
  var v=document.getElementById('jIn').value.trim();
  if(!v){jSet('Paste some JSON first.',false);return;}
  try{
    var o=JSON.parse(v);
    var ind=document.getElementById('jIndent').value;
    var sp=ind==='tab'?'\t':parseInt(ind,10);
    document.getElementById('jOut').value=JSON.stringify(o,null,sp);
    jSet('Valid JSON — formatted.',true);
  }catch(e){jSet('Invalid JSON: '+e.message,false);}
}
function jMin(){
  var v=document.getElementById('jIn').value.trim();
  if(!v){jSet('Paste some JSON first.',false);return;}
  try{document.getElementById('jOut').value=JSON.stringify(JSON.parse(v));jSet('Valid JSON — minified.',true);}
  catch(e){jSet('Invalid JSON: '+e.message,false);}
}
function jClr(){document.getElementById('jIn').value='';document.getElementById('jOut').value='';document.getElementById('jMsg').innerHTML='';}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('jFmt'==='grInit'){grAdd();grAdd();grAdd();}
    else if('jFmt'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('jFmt'&&typeof window['jFmt']==='function'){window['jFmt']();}
  }catch(e){console.warn(e);}
});
</script>
