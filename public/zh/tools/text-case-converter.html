<script>

function cWords(t){return t.trim().split(/\s+/).filter(Boolean);}
function cConv(){
  var t=document.getElementById('cIn').value;
  var m=document.getElementById('cMode').value,o='';
  var w=cWords(t);
  if(m==='upper')o=t.toUpperCase();
  else if(m==='lower')o=t.toLowerCase();
  else if(m==='title')o=w.map(function(x){return x.charAt(0).toUpperCase()+x.slice(1).toLowerCase();}).join(' ');
  else if(m==='sentence')o=t.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g,function(c){return c.toUpperCase();});
  else if(m==='camel')o=w.map(function(x,i){var l=x.toLowerCase();return i?l.charAt(0).toUpperCase()+l.slice(1):l;}).join('');
  else if(m==='pascal')o=w.map(function(x){var l=x.toLowerCase();return l.charAt(0).toUpperCase()+l.slice(1);}).join('');
  else if(m==='snake')o=w.join('_').toLowerCase();
  else if(m==='kebab')o=w.join('-').toLowerCase();
  else if(m==='constant')o=w.join('_').toUpperCase();
  else if(m==='alt')o=t.replace(/\s+/g,'').split('').map(function(c,i){return i%2?c.toUpperCase():c.toLowerCase();}).join('');
  document.getElementById('cOut').value=o;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('cConv'==='grInit'){grAdd();grAdd();grAdd();}
    else if('cConv'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('cConv'&&typeof window['cConv']==='function'){window['cConv']();}
  }catch(e){console.warn(e);}
});
</script>
