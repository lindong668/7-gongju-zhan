<h1 style="margin:0">成绩计算器</h1></div>
<p>计算加权成绩，以及期末需要考多少分。</p></div>
<div class="panel"><div class="fld"><label>模式</label><select id="grM" onchange="grM()">
<option value="w">加权平均</option><option value="f">期末需要考多少分？</option></select></div>
<div id="grW">
<div id="grRows"></div>
<button class="btn-o" onclick="grAdd()" style="margin-top:8px">+ 添加一行</button>
</div>
<div id="grF" style="display:none">
<div class="row">
<div class="fld"><label for="grCur">当前成绩（%）</label><input id="grCur" type="number" value="82" oninput="grRun()"></div>
<div class="fld"><label for="grTarget">目标成绩（%）</label><input id="grTarget" type="number" value="90" oninput="grRun()"></div>
<div class="fld"><label for="grWt">期末权重（%）</label><input id="grWt" type="number" value="30" oninput="grRun()"></div>
</div></div>
<button class="btn" style="margin-top:12px" onclick="grRun()">计算</button>
<div class="out" style="margin-top:12px"><div class="out-val" id="grOut">—</div><div class="out-sub" id="grSub"></div></div></div>
</main>

<script>

var grN=0;
function grAdd(){
  var box=document.getElementById('grRows');
  var id='grr'+(grN++);
  var d=document.createElement('div');
  d.className='row';
  d.innerHTML='<div class="fld"><label>分数（%）</label><input type="number" value="85" oninput="grRun()"></div>'
    +'<div class="fld"><label>权重（%）</label><input type="number" value="25" oninput="grRun()"></div>'
    +'<div class="fld" style="flex:0 0 auto;min-width:auto"><label>&nbsp;</label><button class="btn-o" onclick="this.closest(\'.row\').remove();grRun()">✕</button></div>';
  box.appendChild(d);
  grRun();
}
function grM(){
  var m=document.getElementById('grM').value;
  document.getElementById('grW').style.display=m==='w'?'':'none';
  document.getElementById('grF').style.display=m==='f'?'':'none';
  grRun();
}
function grRun(){
  var m=document.getElementById('grM').value;
  var o=document.getElementById('grOut'),s=document.getElementById('grSub');
  if(m==='w'){
    var rows=document.querySelectorAll('#grRows .row');
    var num=0,den=0;
    rows.forEach(function(r){
      var i=r.querySelectorAll('input');
      var sc=parseFloat(i[0].value)||0,wt=parseFloat(i[1].value)||0;
      num+=sc*wt;den+=wt;
    });
    if(!den){o.textContent='—';s.textContent='Add at least one row.';return;}
    var g=num/den;
    o.textContent=g.toFixed(2)+'%';
    s.textContent=den===100?'Weights total 100%.':'Weights total '+den+'% — result is normalised to 100%.';
  }else{
    var cur=parseFloat(document.getElementById('grCur').value)||0;
    var tg=parseFloat(document.getElementById('grTarget').value)||0;
    var wt=parseFloat(document.getElementById('grWt').value)||0;
    if(wt<=0||wt>100){o.textContent='—';s.textContent='Final weight must be between 1 and 100.';return;}
    var need=(tg-cur*(1-wt/100))/(wt/100);
    o.textContent=need.toFixed(2)+'%';
    if(need>100)s.textContent='That needs more than 100% — the target is out of reach.';
    else if(need<0)s.textContent='You have already secured the target even with a zero.';
    else s.textContent='Score needed on the final.';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('grInit'==='grInit'){grAdd();grAdd();grAdd();}
    else if('grInit'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('grInit'&&typeof window['grInit']==='function'){window['grInit']();}
  }catch(e){console.warn(e);}
});
</script>
