<p>按 90 分钟周期推算最佳入睡与起床时间。</p></div>
<div class="panel"><div class="fld"><label>模式</label><select id="slM" onchange="slM()">
<option value="w">我想在…起床</option><option value="b">我想在…入睡</option></select></div>

<div class="out" style="margin-top:12px"><div class="out-val" id="slMain">—</div><div class="out-sub" id="slSub"></div></div>

<script>

function slM(){
  var w=document.getElementById('slM').value==='w';
  document.getElementById('slL').textContent=w?'Wake-up time':'Bedtime';
  slRun();
}
function slFmt(d){
  var h=d.getHours(),m=d.getMinutes();
  var ap=h>=12?'PM':'AM';
  var h12=h%12;if(h12===0)h12=12;
  return h12+':'+(m<10?'0':'')+m+' '+ap;
}
function slRun(){
  var v=document.getElementById('slT').value;
  if(!v){document.getElementById('slMain').textContent='—';return;}
  var p=v.split(':');
  var base=new Date();base.setHours(parseInt(p[0],10),parseInt(p[1],10),0,0);
  var fall=parseFloat(document.getElementById('slFall').value)||0;
  var cyc=parseFloat(document.getElementById('slCyc').value)||5;
  var w=document.getElementById('slM').value==='w';
  var list=[];
  if(w){
    /* 起床时间倒推上床时间：起床 - cycles*90min - 入睡时间 */
    var bed=new Date(base.getTime()-(cyc*90+fall)*60000);
    document.getElementById('slMain').textContent='Go to bed at '+slFmt(bed);
    document.getElementById('slSub').textContent=cyc+' cycles = '+(cyc*1.5).toFixed(1)+' h of sleep, plus '+fall+' min to fall asleep.';
    for(var c=3;c<=6;c++){
      var b2=new Date(base.getTime()-(c*90+fall)*60000);
      list.push({t:slFmt(b2),h:(c*1.5).toFixed(1)});
    }
  }else{
    var wake=new Date(base.getTime()+(cyc*90+fall)*60000);
    document.getElementById('slMain').textContent='Wake up at '+slFmt(wake);
    document.getElementById('slSub').textContent=cyc+' cycles = '+(cyc*1.5).toFixed(1)+' h of sleep, plus '+fall+' min to fall asleep.';
    for(var c2=3;c2<=6;c2++){
      var w2=new Date(base.getTime()+(c2*90+fall)*60000);
      list.push({t:slFmt(w2),h:(c2*1.5).toFixed(1)});
    }
  }
  var h='';
  list.forEach(function(x){
    h+='<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px"><b>'+x.t+'</b><span style="color:var(--muted)">'+x.h+' h sleep</span></div>';
  });
  document.getElementById('slList').innerHTML=h;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('slM'==='grInit'){grAdd();grAdd();grAdd();}
    else if('slM'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('slM'&&typeof window['slM']==='function'){window['slM']();}
  }catch(e){console.warn(e);}
});
</script>
