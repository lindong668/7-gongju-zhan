<script>

function nbRun(){
  var v=document.getElementById('nbIn').value.trim();
  var from=parseInt(document.getElementById('nbFrom').value,10);
  var msg=document.getElementById('nbMsg');
  if(!v){['nb2','nb8','nb10','nb16','nbs'].forEach(function(i){document.getElementById(i).textContent='—';});msg.innerHTML='';return;}
  var n;
  try{
    if(from===10){n=BigInt(v);}
    else{
      var ok=from===16?/^[0-9a-fA-F]+$/.test(v):(from===2?/^[01]+$/.test(v):/^[0-7]+$/.test(v));
      if(!ok)throw new Error('Invalid digits for base '+from);
      n=BigInt(0);
      var base=BigInt(from);
      for(var i=0;i<v.length;i++){
        n=n*base+BigInt(parseInt(v[i],from===16?16:10));
      }
    }
    document.getElementById('nb2').textContent=n.toString(2);
    document.getElementById('nb8').textContent=n.toString(8);
    document.getElementById('nb10').textContent=n.toString(10);
    document.getElementById('nb16').textContent=n.toString(16).toUpperCase();
    var s32=BigInt.asIntN(32,n);
    document.getElementById('nbs').textContent=s32.toString(10);
    msg.innerHTML='';
  }catch(e){msg.innerHTML='<div class="err-t">'+e.message+'</div>';}
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('nbRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('nbRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('nbRun'&&typeof window['nbRun']==='function'){window['nbRun']();}
  }catch(e){console.warn(e);}
});
</script>
