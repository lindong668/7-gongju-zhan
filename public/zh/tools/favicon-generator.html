<script>

var fvImg=null;
function fvRun(){
  var f=document.getElementById('fvF').files[0];
  if(!f)return;
  var url=URL.createObjectURL(f);
  fvImg=new Image();
  fvImg.onload=function(){
    var sizes=[16,32,48,180,192,512];
    var prev=document.getElementById('fvPrev'),dl=document.getElementById('fvDl');
    prev.innerHTML='';dl.innerHTML='';
    var tags=['<link rel="icon" href="/favicon.ico" sizes="any">',
      '<link rel="icon" href="/favicon.svg" type="image/svg+xml">',
      '<link rel="apple-touch-icon" href="/apple-touch-icon.png">',
      '<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">',
      '<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">'];
    sizes.forEach(function(s){
      var c=document.createElement('canvas');c.width=s;c.height=s;
      var ctx=c.getContext('2d');
      ctx.drawImage(fvImg,0,0,s,s);
      var box=document.createElement('div');
      box.style.textAlign='center';
      box.innerHTML='<img src="'+c.toDataURL('image/png')+'" width="'+Math.min(s,64)+'" style="border:1px solid var(--border);border-radius:8px;background:#fff"><div style="font-size:11px;color:var(--muted);margin-top:3px">'+s+'px</div>';
      prev.appendChild(box);
      c.toBlob(function(b){
        if(!b)return;
        var u=URL.createObjectURL(b);
        var a=document.createElement('a');
        a.className='btn-o';a.style.marginRight='8px';a.style.display='inline-block';a.style.marginBottom='8px';
        a.textContent='Download '+s+'×'+s;
        a.href=u;a.download='icon-'+s+'.png';
        dl.appendChild(a);
      },'image/png');
    });
    document.getElementById('fvOut').value=tags.join('\n');
  };
  fvImg.src=url;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if(''==='grInit'){grAdd();grAdd();grAdd();}
    else if(''==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if(''&&typeof window['']==='function'){window['']();}
  }catch(e){console.warn(e);}
});
</script>
