<h1 style="margin:0">日期间隔计算器</h1></div>
<p>计算两个日期之间相差的天数、周数、月数与年数。</p></div>
<div class="panel"><div class="row">
<div class="fld"><label for="ddA">开始日期</label><input id="ddA" type="date" value="2026-01-01" oninput="ddRun()"></div>
<div class="fld"><label for="ddB">结束日期</label><input id="ddB" type="date" value="2026-12-31" oninput="ddRun()"></div>
</div>
<div class="fld"><label><input type="checkbox" id="ddInc" onchange="ddRun()"> Include the end date</label></div>
<button class="btn" onclick="ddRun()">计算</button>
<div class="res-grid" style="margin-top:14px">
<div class="res-cell"><div class="k">Days</div><div class="v" id="ddD">—</div></div>
<div class="res-cell"><div class="k">Weeks</div><div class="v" id="ddW">—</div></div>
<div class="res-cell"><div class="k">Months</div><div class="v" id="ddM">—</div></div>
<div class="res-cell"><div class="k">Years</div><div class="v" id="ddY">—</div></div>
</div>
<div id="ddMsg" style="margin-top:12px"></div></div>

<script>

(function(){var d=new Date();var b=document.getElementById('ddB');if(b)b.value=d.toISOString().slice(0,10);})();
function ddRun(){
  var a=document.getElementById('ddA').value,b=document.getElementById('ddB').value;
  if(!a||!b){return;}
  var da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00');
  var inc=document.getElementById('ddInc').checked;
  var ms=db-da;
  var days=Math.floor(ms/86400000);
  var dur=days<0?-days:days;
  if(inc)dur+=1;
  document.getElementById('ddD').textContent=dur;
  document.getElementById('ddW').textContent=(dur/7).toFixed(1);
  var mo=(db.getFullYear()-da.getFullYear())*12+(db.getMonth()-da.getMonth());
  if(db.getDate()<da.getDate())mo--;
  document.getElementById('ddM').textContent=Math.abs(mo);
  document.getElementById('ddY').textContent=(dur/365.25).toFixed(2);
  var msg=days<0?'The end date is before the start date — showing absolute values.':'';
  document.getElementById('ddMsg').innerHTML=msg?'<p class="note">'+msg+'</p>':'';
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('ddRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('ddRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('ddRun'&&typeof window['ddRun']==='function'){window['ddRun']();}
  }catch(e){console.warn(e);}
});
</script>
