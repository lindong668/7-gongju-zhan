<option value="len">长度</option><option value="wt">重量</option><option value="tmp">温度</option>

<script>

var UC={
 len:{base:'m',u:{m:1,km:1000,cm:0.01,mm:0.001,um:1e-6,nm:1e-9,inch:0.0254,ft:0.3048,yd:0.9144,mi:1609.344,nmi:1852}},
 wt:{base:'kg',u:{kg:1,g:0.001,mg:1e-6,t:1000,lb:0.45359237,oz:0.028349523125,st:6.35029318}},
 tmp:{base:'C',u:{C:'c',F:'f',K:'k'}},
 area:{base:'m2',u:{m2:1,km2:1e6,cm2:1e-4,ha:10000,acre:4046.8564224,ft2:0.09290304,in2:0.00064516,yd2:0.83612736,mi2:2589988.110336}},
 vol:{base:'l',u:{l:1,ml:0.001,m3:1000,cm3:0.001,gal_us:3.785411784,gal_uk:4.54609,qt_us:0.946352946,pt_us:0.473176473,cup_us:0.2365882365,floz_us:0.0295735295625,floz_uk:0.0284130625,tbsp:0.01478676478125,tsp:0.00492892159375}}
};
function ucCat(){
  var c=document.getElementById('ucCat').value;
  var us=Object.keys(UC[c].u);
  var f=document.getElementById('ucF'),t=document.getElementById('ucT');
  f.innerHTML=us.map(function(x){return '<option value="'+x+'">'+x+'</option>';}).join('');
  t.innerHTML=us.map(function(x){return '<option value="'+x+'"'+(x===us[1]?' selected':'')+'>'+x+'</option>';}).join('');
  if(c==='tmp'){f.value='C';t.value='F';}
  ucRun();
}
function ucToBase(c,from,v){
  if(c==='tmp'){
    if(from==='C')return v;
    if(from==='F')return (v-32)*5/9;
    if(from==='K')return v-273.15;
  }
  return v*UC[c].u[from];
}
function ucFromBase(c,to,v){
  if(c==='tmp'){
    if(to==='C')return v;
    if(to==='F')return v*9/5+32;
    if(to==='K')return v+273.15;
  }
  return v/UC[c].u[to];
}
function ucRun(){
  var c=document.getElementById('ucCat').value;
  var v=parseFloat(document.getElementById('ucV').value);
  var f=document.getElementById('ucF').value,t=document.getElementById('ucT').value;
  if(isNaN(v)){document.getElementById('ucOut').textContent='—';return;}
  var b=ucToBase(c,f,v),r=ucFromBase(c,t,b);
  var o=document.getElementById('ucOut');
  o.textContent=(Math.abs(r)<1e-4||Math.abs(r)>=1e6)?r.toExponential(4):parseFloat(r.toPrecision(10)).toString();
  document.getElementById('ucSub').textContent=v+' '+f+' = '+o.textContent+' '+t;
  var h='';
  Object.keys(UC[c].u).forEach(function(x){
    var vv=ucFromBase(c,x,b);
    var s=(Math.abs(vv)<1e-4||Math.abs(vv)>=1e6)?vv.toExponential(4):parseFloat(vv.toPrecision(8)).toString();
    h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px"><span style="color:var(--muted)">'+x+'</span><b>'+s+'</b></div>';
  });
  document.getElementById('ucAll').innerHTML=h;
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('ucCat'==='grInit'){grAdd();grAdd();grAdd();}
    else if('ucCat'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('ucCat'&&typeof window['ucCat']==='function'){window['ucCat']();}
  }catch(e){console.warn(e);}
});
</script>
