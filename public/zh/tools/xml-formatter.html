<script>

function xRun(){
  var v=document.getElementById('xIn').value.trim();
  var msg=document.getElementById('xMsg');
  if(!v){msg.innerHTML='<div class="err-t">Paste some XML first.</div>';return;}
  try{
    if(typeof DOMParser==='undefined')throw new Error('DOMParser unavailable');
    var doc=new DOMParser().parseFromString(v,'application/xml');
    var err=doc.getElementsByTagName('parsererror');
    if(err.length){throw new Error(err[0].textContent.split('\n')[0]);}
    var lines=v.replace(/>\s*</g,'>\n<').split('\n');
    var out=[],depth=0;
    lines.forEach(function(raw){
      var l=raw.trim();if(!l)return;
      var selfClosing=/^<\?|^<\/|^<[^>]+\/>/.test(l);
      var closing=/^<\//.test(l);
      if(closing)depth=Math.max(0,depth-1);
      out.push('  '.repeat(depth)+l);
      if(!selfClosing&&!closing&&!/^<\?/.test(l))depth++;
    });
    document.getElementById('xOut').value=out.join('\n');
    msg.innerHTML='<div class="ok-t">Well-formed XML — formatted.</div>';
  }catch(e){
    msg.innerHTML='<div class="err-t">Not well-formed: '+e.message+'</div>';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('xRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('xRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('xRun'&&typeof window['xRun']==='function'){window['xRun']();}
  }catch(e){console.warn(e);}
});
</script>
