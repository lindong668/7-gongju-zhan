<script>

(function(){var d=new Date();document.getElementById('tsV').value=Math.floor(d.getTime()/1000);
 var p=document.getElementById('tsD');if(p){var t=new Date(d.getTime()-d.getTimezoneOffset()*60000);p.value=t.toISOString().slice(0,16);}tsRun();tsBack();})();
function tsNow(){
  var d=new Date();
  document.getElementById('tsV').value=document.getElementById('tsU').value==='ms'?d.getTime():Math.floor(d.getTime()/1000);
  tsRun();
}
function tsRun(){
  var v=parseFloat(document.getElementById('tsV').value);
  if(isNaN(v)){return;}
  var ms=document.getElementById('tsU').value==='ms'?v:v*1000;
  var d=new Date(ms);
  if(isNaN(d.getTime())){document.getElementById('tsUtc').textContent='Invalid';return;}
  document.getElementById('tsUtc').textContent=d.toUTCString();
  document.getElementById('tsLoc').textContent=d.toString();
  document.getElementById('tsIso').textContent=d.toISOString();
  var diff=(d-new Date())/1000;
  var a=Math.abs(diff);
  var s;
  if(a<60)s=Math.round(diff)+' s';
  else if(a<3600)s=Math.round(diff/60)+' min';
  else if(a<86400)s=Math.round(diff/3600)+' h';
  else if(a<2592000)s=Math.round(diff/86400)+' days';
  else s=Math.round(diff/2592000)+' months';
  document.getElementById('tsRel').textContent=(diff>=0?'in ':'')+s+(diff<0?' ago':'');
}
function tsBack(){
  var v=document.getElementById('tsD').value;
  if(!v){document.getElementById('tsBack').textContent='—';return;}
  var d=new Date(v);
  document.getElementById('tsBack').textContent=Math.floor(d.getTime()/1000)+' s · '+d.getTime()+' ms';
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('tsRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('tsRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('tsRun'&&typeof window['tsRun']==='function'){window['tsRun']();}
  }catch(e){console.warn(e);}
});
</script>
