<script>

/* 标准等额本息：M = P·i·(1+i)^n / ((1+i)^n − 1)  i=月利率 */
function fPmt(P,annualPct,years){
  var n=Math.round(years*12), i=annualPct/100/12;
  if(n<=0)return 0;
  if(i===0)return P/n;
  var f=Math.pow(1+i,n);
  return P*i*f/(f-1);
}
function fMoney(x,cur){
  cur=cur||'$';
  return (x<0?'-':'')+cur+Math.abs(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fAmort(P,annualPct,years){
  var n=Math.round(years*12), i=annualPct/100/12;
  var m=fPmt(P,annualPct,years), bal=P, rows=[], ti=0;
  for(var k=1;k<=n&&k<=600;k++){
    var int_=bal*i, prin=m-int_;
    if(prin>bal)prin=bal;
    ti+=int_; bal-=prin;
    rows.push({k:k,pmt:m,int_:int_,prin:prin,bal:Math.max(0,bal)});
    if(bal<=0.005)break;
  }
  return {rows:rows,totalInterest:ti,monthly:m};
}
function mRun(){
  var price=parseFloat(document.getElementById('mPrice').value)||0;
  var down=parseFloat(document.getElementById('mDown').value)||0;
  var rate=parseFloat(document.getElementById('mRate').value)||0;
  var yrs=parseFloat(document.getElementById('mYrs').value)||30;
  var tax=(parseFloat(document.getElementById('mTax').value)||0)/12;
  var ins=(parseFloat(document.getElementById('mIns').value)||0)/12;
  var hoa=parseFloat(document.getElementById('mHoa').value)||0;
  var pmiPct=parseFloat(document.getElementById('mPmi').value)||0;
  var loan=Math.max(0,price-down);
  var pi=fPmt(loan,rate,yrs);
  var ltv=price>0?(loan/price*100):0;
  /* PMI 通常在 LTV 降到 78% 以下时终止（美国常规做法） */
  var pmi=(ltv>78)?(loan*pmiPct/100/12):0;
  var all=pi+tax+ins+pmi+hoa;
  document.getElementById('mPI').textContent=fMoney(pi);
  document.getElementById('mT').textContent=fMoney(tax);
  document.getElementById('mI').textContent=fMoney(ins);
  document.getElementById('mP').textContent=fMoney(pmi);
  document.getElementById('mH').textContent=fMoney(hoa);
  document.getElementById('mL').textContent=fMoney(loan).replace('$','$');
  document.getElementById('mAll').textContent=fMoney(all);
  var msg='';
  if(ltv>0){
    msg='LTV '+ltv.toFixed(1)+'%. ';
    if(ltv>80)msg+='Above 80% — PMI applies until the balance reaches 78% LTV.';
    else msg+='At or below 80% — no PMI needed on a conventional loan.';
  }
  document.getElementById('mMsg').innerHTML='<p class="note">'+msg+'</p>';
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('mRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('mRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('mRun'&&typeof window['mRun']==='function'){window['mRun']();}
  }catch(e){console.warn(e);}
});
</script>
