<p>对网址参数进行百分号编码与解码。</p></div>

<script>

function uEnc(){document.getElementById('uOut').value=encodeURI(document.getElementById('uIn').value);}
function uEncComp(){document.getElementById('uOut').value=encodeURIComponent(document.getElementById('uIn').value);}
function uDec(){try{document.getElementById('uOut').value=decodeURIComponent(document.getElementById('uIn').value.replace(/\+/g,' '));}catch(e){document.getElementById('uOut').value='Cannot decode: '+e.message;}}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('uEnc'==='grInit'){grAdd();grAdd();grAdd();}
    else if('uEnc'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('uEnc'&&typeof window['uEnc']==='function'){window['uEnc']();}
  }catch(e){console.warn(e);}
});
</script>
