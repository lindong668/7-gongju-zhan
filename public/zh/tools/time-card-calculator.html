<div class="fld"><label for="tcIn">上班时间</label><input id="tcIn" type="time" value="09:00" oninput="tcRun()"></div>
<div class="fld"><label for="tcOut">下班时间</label><input id="tcOut" type="time" value="18:00" oninput="tcRun()"></div>
<div class="fld"><label for="tcBrk">休息（分钟）</label><input id="tcBrk" type="number" value="30" oninput="tcRun()"></div>
</div>

<div class="fld"><label for="tcDays">本期天数</label><input id="tcDays" type="number" value="5" oninput="tcRun()"></div>
<div class="fld"><label for="tcRate">时薪</label><input id="tcRate" type="number" value="22" step="0.01" oninput="tcRun()"></div>
<div class="fld"><label for="tcOT">加班起算（小时/天）</label><input id="tcOT" type="number" value="8" oninput="tcRun()"></div>
</div>
<div class="row"><div class="fld"><label for="tcMul">加班倍率</label><input id="tcMul" type="number" value="1.5" step="0.1" oninput="tcRun()"></div></div>

<div class="res-cell"><div class="k">Regular hrs / period</div><div class="v" id="tcR">—</div></div>
<div class="res-cell"><div class="k">Overtime hrs</div><div class="v" id="tcO">—</div></div>
<div class="res-cell"><div class="k">Gross pay</div><div class="v" id="tcG">—</div></div>

<script>

function tcMin(t){var p=(t||'').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function tcRun(){
  var a=tcMin(document.getElementById('tcIn').value);
  var b=tcMin(document.getElementById('tcOut').value);
  var brk=parseFloat(document.getElementById('tcBrk').value)||0;
  var days=parseFloat(document.getElementById('tcDays').value)||1;
  var rate=parseFloat(document.getElementById('tcRate').value)||0;
  var otThr=parseFloat(document.getElementById('tcOT').value)||8;
  var mul=parseFloat(document.getElementById('tcMul').value)||1.5;
  var perDay=b-a; if(perDay<0)perDay+=1440; /* 跨午夜 */
  perDay=Math.max(0,perDay-brk)/60;
  var reg=Math.min(perDay,otThr), ot=Math.max(0,perDay-otThr);
  var tReg=reg*days, tOt=ot*days;
  var gross=tReg*rate+tOt*rate*mul;
  document.getElementById('tcR').textContent=tReg.toFixed(2);
  document.getElementById('tcO').textContent=tOt.toFixed(2);
  document.getElementById('tcG').textContent='$'+gross.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('tcRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('tcRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('tcRun'&&typeof window['tcRun']==='function'){window['tcRun']();}
  }catch(e){console.warn(e);}
});
</script>
