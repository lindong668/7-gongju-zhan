<script>

function bsRun(){
  var x=document.getElementById('bsX').value,y=document.getElementById('bsY').value;
  var b=document.getElementById('bsB').value,s=document.getElementById('bsS').value;
  var c=document.getElementById('bsC').value,o=document.getElementById('bsO').value/100;
  var ins=document.getElementById('bsI').checked?' inset':'';
  var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),bl=parseInt(c.slice(5,7),16);
  var css=x+'px '+y+'px '+b+'px '+s+'px rgba('+r+', '+g+', '+bl+', '+o+')'+ins;
  document.getElementById('bsPrev').style.boxShadow=css;
  document.getElementById('bsOut').value='box-shadow: '+css+';';
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('bsRun'==='grInit'){grAdd();grAdd();grAdd();}
    else if('bsRun'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('bsRun'&&typeof window['bsRun']==='function'){window['bsRun']();}
  }catch(e){console.warn(e);}
});
</script>
