<p>求百分比、百分比变化，以及 X 占 Y 的百分比。</p></div>
<div class="panel"><div class="row">
<div class="fld"><label>模式</label><select id="pMode" onchange="pMode()">
<option value="1">X 占 Y 的百分之多少？</option><option value="2">X 是 Y 的百分之几？</option>
<option value="3">从 A 到 B 的变化百分比</option></select></div>
</div>
<div class="row" id="pRow">
<div class="fld"><label id="pL1" for="pA">X (%)</label><input id="pA" type="number" value="15" oninput="pRun()"></div>
<div class="fld"><label id="pL2" for="pB">Y</label><input id="pB" type="number" value="200" oninput="pRun()"></div>
</div>
<div class="out"><div class="out-val" id="pOut">—</div><div class="out-sub" id="pSub"></div></div>
<p class="note">A percentage point is an absolute gap between two percentages; percent change is relative. 4% → 6% is 2 points but a 50% increase.</p></div>

<script>

function pMode(){
  var m=document.getElementById('pMode').value;
  var l1=document.getElementById('pL1'),l2=document.getElementById('pL2');
  if(m==='1'){l1.textContent='X (%)';l2.textContent='Y';}
  else if(m==='2'){l1.textContent='X';l2.textContent='Y';}
  else {l1.textContent='From (A)';l2.textContent='To (B)';}
  pRun();
}
function pRun(){
  var m=document.getElementById('pMode').value;
  var a=parseFloat(document.getElementById('pA').value);
  var b=parseFloat(document.getElementById('pB').value);
  var o=document.getElementById('pOut'),s=document.getElementById('pSub');
  if(isNaN(a)||isNaN(b)){o.textContent='—';s.textContent='';return;}
  if(m==='1'){var r=a/100*b;o.textContent=r;s.textContent=a+'% of '+b+' = '+r;}
  else if(m==='2'){
    if(b===0){o.textContent='—';s.textContent='Y cannot be zero.';return;}
    var p=a/b*100;o.textContent=p.toFixed(4).replace(/\.?0+$/,'')+'%';s.textContent=a+' out of '+b;
  } else {
    if(a===0){o.textContent='—';s.textContent='Start value cannot be zero.';return;}
    var c=(b-a)/a*100;
    o.textContent=(c>=0?'+':'')+c.toFixed(2)+'%';
    s.textContent=c>=0?'increase':'decrease';
  }
}
document.addEventListener('DOMContentLoaded',function(){
  try{
    if('pMode'==='grInit'){grAdd();grAdd();grAdd();}
    else if('pMode'==='gpInit'){gpAdd();gpAdd();gpAdd();}
    else if('pMode'&&typeof window['pMode']==='function'){window['pMode']();}
  }catch(e){console.warn(e);}
});
</script>
